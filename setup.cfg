[mypy]
strict = True
plugins = sqlalchemy.ext.mypy.plugin

# Legacy Streamlit prototype — untyped third-party libs (requests, pandas, plotly).
# This file is not part of the active application.
[mypy-app.ui.dashboard]
ignore_errors = True

# Week 5 FastAPI route handlers were written without explicit return-type annotations.
# Routes are thin wrappers over the typed service layer (CLAUDE.md convention);
# strict typing of their signatures is a follow-up hardening pass.
[mypy-app.api.routes]
ignore_errors = True

[mypy-app.api.routes.*]
ignore_errors = True
